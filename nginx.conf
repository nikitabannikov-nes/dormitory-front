server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # index.html никогда не кешируем — иначе браузер может долго
    # держать старую HTML-страницу со ссылками на JS/CSS-чанки,
    # которых уже нет после следующего деплоя (у Vite имена файлов
    # хешированные и меняются при каждой сборке)
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Хешированные ассеты Vite — имя файла меняется при изменении
    # содержимого, поэтому их можно кешировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vue Router — все 404 отдаём index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем /api на Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
